name: Branch Policy Validation

on:
  pull_request:
    # edited fires when the PR's base branch is changed
    types: [opened, synchronize, reopened, edited]

jobs:
  branch-policy:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Validate branch hierarchy
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "Validating PR: $HEAD_REF -> $BASE_REF"

          # Task branch: TASK_<feature>_<positive integer>
          task='^TASK_[A-Za-z0-9_]+_[1-9][0-9]*$'

          # 1. TASK_<feature>_<number> -> test
          if [ "$BASE_REF" = "test" ] && [[ "$HEAD_REF" =~ $task ]]; then
            echo "✓ Valid: task -> test"; exit 0
          fi
          # 2. test -> main
          if [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" = "test" ]; then
            echo "✓ Valid: test -> main"; exit 0
          fi

          echo "Error: Invalid branch hierarchy"
          echo "Allowed:"
          echo "  1. TASK_<feature>_<number> -> test  (e.g. TASK_users_1 -> test)"
          echo "  2. test -> main"
          exit 1
